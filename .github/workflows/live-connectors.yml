# Weekly check that the Greenhouse, Lever and Ashby connectors still understand
# the real platforms' public APIs (they can change without notice). Not run on
# push: CI must not depend on third-party uptime. Run it by hand from the
# Actions tab ("Run workflow") after touching a connector.
name: Live connectors

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Real job-board APIs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Live connector tests
        run: pytest -m live tests/live -v
