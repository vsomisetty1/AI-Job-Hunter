# CI: lint, type-check, test and smoke-test on every push and pull request.
# Each project phase extends this workflow with the checks for what it adds
# (see docs/TESTING.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"

jobs:
  backend:
    name: Backend (lint, types, tests, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # App database (smoke test) and a separate throwaway database for tests:
      # the migration tests drop every table.
      DATABASE_URL: postgresql://jobhunter:ci_password@localhost:5432/jobhunter
      TEST_DATABASE_URL: postgresql+psycopg2://jobhunter:ci_password@localhost:5432/jobhunter_test
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Install Chromium (application automation tests)
        # Browser tests drive a real Chromium against mock ATS pages (no network).
        run: python -m playwright install --with-deps chromium

      - name: Lint (incl. security rules)
        run: ruff check app tests migrations ../scripts/gen_api_contract.py

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Format check
        run: ruff format --check app tests migrations ../scripts/gen_api_contract.py

      - name: API contract is current (frontend/src/types/api.gen.ts)
        run: python ../scripts/gen_api_contract.py --check

      - name: Type check (mypy --strict)
        run: mypy

      - name: Create test database
        run: psql -h localhost -U jobhunter -d jobhunter -c "CREATE DATABASE jobhunter_test"

      - name: Server version
        run: psql -h localhost -U jobhunter -d jobhunter -tAc "SHOW server_version"

      - name: Tests (unit, database integration, browser)
        # Any skip fails the job: a misconfigured TEST_DATABASE_URL would
        # otherwise silently skip every database test.
        run: |
          pytest -ra 2>&1 | tee /tmp/pytest.txt
          if grep -qE "[0-9]+ skipped" /tmp/pytest.txt; then
            echo "::error::tests were skipped"; exit 1
          fi

      - name: Smoke test (real server)
        run: ../scripts/smoke_backend.sh

      - name: Backup and restore round trip (on the smoke test's data)
        # pg_dump/pg_restore come from the postgres:19 image (the runner's client
        # tools are older than the server).
        run: ../scripts/test_backup_restore.sh

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh backend/docker-entrypoint.sh

  docker:
    name: Docker (images, Compose stack, backup/restore)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (.env from the example)
        run: |
          cp .env.example .env
          sed -i 's/change_me/ci_password/g' .env

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build images (backend with Chromium, frontend)
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Compose smoke test (guard, ports, users, Chromium, backup/restore)
        run: scripts/smoke_compose.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

      - name: Typecheck (incl. API contract types, src/types/contract.ts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (incl. API contract paths)
        run: npm test

      - name: Build
        run: npm run build
