[project]
name = "ai-job-hunter-backend"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Deprecations from our code or dependencies fail the run, so upgrades surface them early.
filterwarnings = ["error"]
testpaths = ["tests"]
# `live` tests call the real job-board APIs; run them on demand with `pytest -m live`.
markers = ["live: calls real public job-board APIs (opt-in, needs network)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE", "S", "RUF100"]
# B008: FastAPI Depends() in defaults is the documented pattern.
# ASYNC109: timeout params on BackgroundTaskManager are grace periods, not I/O timeouts.
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Raw document bytes (PDF objects, OOXML) read better unwrapped.
"tests/fixtures/*" = ["E501"]
# Tests: plain asserts and dummy credentials are expected.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "S608"]
# Vocabulary tables: one row per line reads better than one entry per line.
"app/parsing/skills.py" = ["E501"]
"app/parsing/sections.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdfminer.*", "docx.*", "storage3.*", "phonenumbers.*", "apscheduler.*", "rapidfuzz.*"]
ignore_missing_imports = true
